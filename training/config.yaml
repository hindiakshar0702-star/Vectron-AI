# ============================================================
# Vectron AI - LoRA fine-tuning configuration
# ============================================================
# Three presets are commented below. Pick one by editing values
# or pass --preset {colab_t4, colab_a100, runpod_a100} to train_lora.py.
# ============================================================

# --- Model ---
# Recommended:
#   Qwen/Qwen2.5-Coder-0.5B-Instruct  (4 GB VRAM, T4 friendly)
#   Qwen/Qwen2.5-Coder-1.5B-Instruct  (8 GB VRAM, A100/4090 friendly)
#   Qwen/Qwen2.5-Coder-7B-Instruct    (24 GB VRAM, A100 80 GB)
model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct

# --- Data ---
train_file: data/train.jsonl
eval_file: data/eval.jsonl
max_seq_length: 2048

# --- Output ---
output_dir: checkpoints/vectron-v0.1
run_name: vectron-v0.1

# --- LoRA ---
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none

# --- Quantization (4-bit NF4 via bitsandbytes) ---
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

# --- Training hyperparams ---
training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  logging_steps: 25
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  group_by_length: true
  report_to: wandb        # change to "tensorboard" or "none"
  seed: 42

# ============================================================
# Preset overrides (selected via --preset on the CLI)
# ============================================================
presets:
  colab_t4:
    model_name: Qwen/Qwen2.5-Coder-0.5B-Instruct
    training:
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 8
      bf16: false
      fp16: true
      gradient_checkpointing: true

  colab_a100:
    model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
    training:
      per_device_train_batch_size: 8
      gradient_accumulation_steps: 2

  runpod_a100:
    model_name: Qwen/Qwen2.5-Coder-7B-Instruct
    training:
      per_device_train_batch_size: 4
      gradient_accumulation_steps: 4
      learning_rate: 1.5e-4
